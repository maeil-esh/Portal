<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ESH 질의응답 창구</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<meta name="color-scheme" content="dark light">
<script>try{var t=localStorage.getItem("yess-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* Layout: 상단 앱바(모드 전환) + 탭 + 단일 작업영역. 사용자(접수/나의 질의/전체 질의) ↔ 관리자(답변 관리) */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunken:#e9eeec; --line:#d3dbd8; --line-strong:#aab7b2;
  --fg:#17211f; --muted:#5b6965; --accent:#1d5c55; --accent-ink:#ffffff; --accent-soft:#dcebe7;
  --wait:#8a5a00; --wait-bg:#fbefd6; --done:#1e6b3a; --done-bg:#dcf1e2;
  --hold:#6a6f76; --hold-bg:#e7e9ec; --plan:#2a4f9e; --plan-bg:#e0e8fa; --danger:#b3261e;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#18211f; --sunken:#1f2a27; --line:#2d3a37; --line-strong:#465652;
  --fg:#e5ecea; --muted:#97a6a1; --accent:#6fbfb2; --accent-ink:#0d1a18; --accent-soft:#1f3632;
  --wait:#f0c26a; --wait-bg:#3a2e14; --done:#7ed49a; --done-bg:#183324; --hold:#b4b9c0; --hold-bg:#2a2e33;
  --plan:#9db8f2; --plan-bg:#1e2a44; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#18211f; --sunken:#1f2a27; --line:#2d3a37; --line-strong:#465652;
  --fg:#e5ecea; --muted:#97a6a1; --accent:#6fbfb2; --accent-ink:#0d1a18; --accent-soft:#1f3632;
  --wait:#f0c26a; --wait-bg:#3a2e14; --done:#7ed49a; --done-bg:#183324; --hold:#b4b9c0; --hold-bg:#2a2e33;
  --plan:#9db8f2; --plan-bg:#1e2a44; --danger:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.app{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;text-decoration:none;color:inherit;cursor:pointer;border-radius:8px}
.brand:focus-visible{outline:2px solid #3182f6;outline-offset:3px}
.brand:hover b{color:#3182f6}
.brand b{font-size:17px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.mode{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:2px;background:var(--sunken)}
.mode button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:5px 14px;border-radius:999px;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;font:inherit;font-weight:600;color:var(--muted);padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs .cnt{font-family:var(--mono);font-size:11px;margin-left:6px;background:var(--wait-bg);color:var(--wait);padding:1px 6px;border-radius:999px}
main{padding-block:24px 64px}
h1{font-size:20px;margin:0 0 4px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 20px;max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* form */
.form{display:grid;grid-template-columns:150px 1fr;}
.form>.lab{padding:16px 18px;font-weight:600;border-bottom:1px solid var(--line);background:var(--sunken)}
.form>.lab small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.form>.fld{padding:12px 18px;border-bottom:1px solid var(--line);min-width:0}
.form>.lab:last-of-type,.form>.fld:last-child{border-bottom:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 160px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input[type=text],input[type=date],select,textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding:8px 10px;width:100%}
textarea{min-height:150px;resize:vertical}
.note{font-size:12px;color:var(--danger);margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:7px 16px;cursor:pointer;font-weight:500;border-right:1px solid var(--line-strong)}
.seg label:last-of-type{border-right:0}
.seg input:checked+label{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-2px}
.drop{border:1px dashed var(--line-strong);border-radius:4px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--sunken);border:1px solid var(--line);border-radius:4px;padding:3px 8px;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0}
.consent{display:flex;flex-direction:column;gap:8px;padding:16px 18px;border-top:1px solid var(--line)}
.consent label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.consent input{margin-top:3px;accent-color:var(--accent)}
.consent details{font-size:12px;color:var(--muted);margin-left:24px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line)}
.btn{font:inherit;font-weight:600;font-size:14px;padding:9px 18px;border-radius:4px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--danger);font-size:13px;margin-right:auto;align-self:center}

/* filters + table */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--sunken);border-radius:var(--r) var(--r) 0 0}
.filters .kw{grid-column:span 2}
.filters .go{display:flex;gap:6px;align-items:flex-end}
.tablehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;font-size:13px;color:var(--muted)}
.tablehead b{color:var(--fg);font-family:var(--mono)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.stat{flex:1 1 130px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:var(--fg)}
.stat[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
/* 전체 질의: 가로 스크롤 없이 폭에 맞추고, 10건 높이로 고정 후 세로 스크롤 */
.vnote{color:#6b7684;font-size:12px}
.tscroll.vs{overflow-x:hidden;overflow-y:auto;max-height:600px;border-top:1px solid #e5e8eb}
table.fit{table-layout:fixed;width:100%}
table.fit th,table.fit td{white-space:normal;word-break:break-word;overflow-wrap:anywhere;padding:9px 8px;font-size:12.5px}
table.fit thead th{position:sticky;top:0;z-index:2;white-space:normal}
table.fit td.date{white-space:normal;line-height:1.45}
table.fit td.q .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
table.fit tr.detail td{overflow:visible}
@media(max-width:760px){table.fit{table-layout:auto;min-width:760px}.tscroll.vs{overflow-x:auto}}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface);white-space:nowrap}
th.sort{cursor:pointer;user-select:none}
th.sort::after{content:" ↕";opacity:.4}
th.sort[data-dir="asc"]::after{content:" ↑";opacity:1}
th.sort[data-dir="desc"]::after{content:" ↓";opacity:1}
td.num,td.date{font-family:var(--mono);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
td.q{min-width:240px;max-width:420px}
td.q .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--accent-soft)}
tr.detail td{background:var(--bg);padding:0}
.detail-box{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}
.detail-box h4{margin:0 0 6px;font-size:12px;color:var(--muted)}
.detail-box p{margin:0;white-space:pre-wrap}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.s-wait{background:var(--wait-bg);color:var(--wait)}
.s-done{background:var(--done-bg);color:var(--done)}
.s-hold{background:var(--hold-bg);color:var(--hold)}
.s-plan{background:var(--plan-bg);color:var(--plan)}
.tag{font-size:12px;color:var(--muted);white-space:nowrap}
.doc{font-family:var(--mono);font-size:12px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.clip{font-size:12px;color:var(--muted);white-space:nowrap}
.pager{display:flex;justify-content:center;gap:4px;padding:12px;border-top:1px solid var(--line)}
.pager button{min-width:32px}

/* answer view */
.ans{display:grid;grid-template-columns:150px 1fr}
.ans>div{padding:12px 18px;border-bottom:1px solid var(--line);min-width:0}
.ans>.lab{background:var(--sunken);font-weight:600}
.ro{display:flex;flex-wrap:wrap;gap:6px 18px}
.ro span{white-space:nowrap}
.ro em{font-style:normal;color:var(--muted);font-size:12px;margin-right:4px}
.qtext{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;margin:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line-strong);border-radius:4px;padding:10px 12px;cursor:pointer}
.opt input{accent-color:var(--accent);margin-top:3px}
.opt b{display:block}
.opt small{color:var(--muted);font-size:12px;line-height:1.45}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.back{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0;margin-bottom:12px}
.hist{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.hist .mono{font-family:var(--mono)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:4px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.done-card{padding:28px;text-align:center}
.done-card .no{font-family:var(--mono);font-size:20px;margin:8px 0 4px}
.mock{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:1px 6px;margin-left:6px;vertical-align:middle}

@media (max-width:680px){
  .form,.ans{grid-template-columns:1fr}
  .form>.lab,.ans>.lab{padding:10px 14px 6px;border-bottom:0}
  .form>.fld,.ans>div{padding:6px 14px 14px}
  .detail-box{grid-template-columns:1fr}
  .filters .kw{grid-column:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
/* 화면 톤: 관리감독자 및 유해위험작업 현황 화면과 동일한 블루·그레이·슬레이트 계열 (라이트 고정) */
/* YESS 포털 디자인 통일: 블랙/오프화이트 + 세이프티 라임 포인트 (다크 기본, 라이트 지원) */
:root:root:root{--bg:#09090B;--surface:#111113;--sunken:#17171A;--line:rgba(255,255,255,.14);--line-strong:rgba(255,255,255,.28);
  --fg:#FAFAFA;--fg2:#DDDDE2;--muted:#B4B4BD;--head:#1C1C20;--head-ink:#F4F4F5;--hover:#1C1C20;
  --accent:#C6F432;--accent-ink:#0B0F00;--accent-soft:rgba(198,244,50,.10);--link:#C6F432;
  --wait:#F5C453;--wait-bg:rgba(245,196,83,.12);--done:#5EE6A8;--done-bg:rgba(94,230,168,.12);--hold:#A1A1AA;--hold-bg:rgba(255,255,255,.06);--plan:#7DB2FF;--plan-bg:rgba(125,178,255,.12);--danger:#FF6B6B;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--r:16px;color-scheme:dark}
@media(prefers-color-scheme:light){:root:root:root:not([data-theme="dark"]){--bg:#F6F6F3;--surface:#FFFFFF;--sunken:#F0F0EC;--line:rgba(0,0,0,.14);--line-strong:rgba(0,0,0,.32);
  --fg:#0B0B0C;--fg2:#2E2E34;--muted:#52525B;--head:#18181B;--head-ink:#FFFFFF;--hover:#F0F0EC;
  --accent:#18181B;--accent-ink:#FFFFFF;--accent-soft:rgba(0,0,0,.06);--link:#18181B;
  --wait:#9A5B00;--wait-bg:#FFF1D6;--done:#0A7A4F;--done-bg:#DDF5E8;--hold:#6B6B74;--hold-bg:#EEEEEA;--plan:#1D4ED8;--plan-bg:#E3ECFF;--danger:#D92D3A;color-scheme:light}}
:root:root:root[data-theme="light"]{--bg:#F6F6F3;--surface:#FFFFFF;--sunken:#F0F0EC;--line:rgba(0,0,0,.14);--line-strong:rgba(0,0,0,.32);
  --fg:#0B0B0C;--fg2:#2E2E34;--muted:#52525B;--head:#18181B;--head-ink:#FFFFFF;--hover:#F0F0EC;
  --accent:#18181B;--accent-ink:#FFFFFF;--accent-soft:rgba(0,0,0,.06);--link:#18181B;
  --wait:#9A5B00;--wait-bg:#FFF1D6;--done:#0A7A4F;--done-bg:#DDF5E8;--hold:#6B6B74;--hold-bg:#EEEEEA;--plan:#1D4ED8;--plan-bg:#E3ECFF;--danger:#D92D3A;color-scheme:light}
body{letter-spacing:-.1px}
header.app{box-shadow:0 1px 0 var(--line)}
.brand{align-items:center}
.brand::before{content:"Q";display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:17px;flex:0 0 34px}
.brand b{font-weight:800;color:var(--fg);font-size:15px;letter-spacing:-.3px}
.mode{background:var(--sunken);border-color:var(--line)}
nav.tabs{border-top:0}
nav.tabs button{letter-spacing:-.2px}
nav.tabs button:hover{color:var(--fg2)}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.panel,.stat{border-color:var(--line);box-shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)}
.btn{border-width:1.5px;border-color:var(--line);border-radius:6px;color:var(--fg2);letter-spacing:-.2px}
.btn:hover{background:var(--sunken);border-color:var(--line-strong)}
.btn.pri{color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{background:var(--link);border-color:var(--link)}
input[type=text],input[type=password],input[type=date],select,textarea{border-width:1.5px;border-color:var(--line);border-radius:6px;transition:border-color .15s}
input[type=text]:focus,input[type=password]:focus,input[type=date]:focus,select:focus,textarea:focus{border-color:var(--accent)}
thead th{background:var(--head);color:var(--head-ink);font-weight:700;letter-spacing:-.2px;border-top:0;border-right:1px solid rgba(255,255,255,.18)}
.form>.lab,.filters{background:var(--sunken)}
.lab,.ans>.lab{color:var(--fg2)}
.chip{background:var(--sunken)}
a.chip{text-decoration:none;color:var(--fg)}
.btn{white-space:nowrap}
.drop{display:block}
td{white-space:nowrap}
td.q,td.empty,tr.detail td{white-space:normal}

/* 가시성 보정안: 톤 유지, 명도 대비만 미세 조정 */
:root:root:root{--bg:var(--sunken);--muted:var(--fg2);--line:var(--line);--line-strong:var(--line-strong);--sunken:var(--sunken);--accent-soft:var(--accent-soft)}
.panel,.stat{border-color:var(--line);box-shadow:0 1px 3px rgba(25,31,40,.08),0 1px 2px rgba(25,31,40,.05)}
input[type=text],input[type=password],input[type=date],input[type=email],select,textarea{border-color:var(--line-strong);background:var(--surface);font-size:14px;color:var(--fg);border-radius:6px;padding:8px 10px;width:100%;font:inherit;font-size:14px;border-width:1.5px;border-style:solid}
input[type=email]:focus{border-color:var(--accent)}
input:focus,select:focus,textarea:focus{outline:0;box-shadow:0 0 0 3px rgba(49,130,246,.16)}
::placeholder{color:var(--muted);opacity:1}
label.f{font-size:12.5px;font-weight:600;color:var(--fg2)}
.form>.lab,.ans>.lab,.filters{background:var(--sunken);color:var(--fg)}
.form>.lab small{color:var(--muted);font-size:12px}
.note{color:var(--fg2);font-size:12.5px;line-height:1.6}
.note b{color:var(--accent)}
.lede{color:var(--fg2)}
.btn{border-color:var(--line-strong);color:var(--fg2)}
.btn:hover{background:var(--sunken);border-color:#b0b8c1}
tbody tr:hover td{background:var(--accent-soft)}
.ans>.lab small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
tbody td{border-bottom-color:var(--line)}
.consent details{color:var(--fg2)}
/* ───── 첫 화면 현황판 (색: 답변 완료 var(--link) / 답변 대기 #eb6834, 글자는 텍스트 토큰) ───── */
.dash{margin:4px 0 26px}
.dash-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.dash-head h1{margin:0}
.dash-asof{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(25,31,40,.06)}
.kpi .k{font-size:12.5px;color:var(--fg2);font-weight:600;display:flex;align-items:center;gap:6px}

/* ---------- 서버 통신 (POST, text/plain → 사전요청 없이 GAS 호출) ---------- */
async function api(action,payload={},ms=60000){
  if(!API||API.includes("여기에"))throw new Error("index.html 상단의 API 주소(GAS 배포 URL)가 설정되지 않았습니다.");
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms);
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...payload}),signal:ctl.signal});
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||"요청에 실패했습니다.");
    return j.data;
  }catch(e){
    if(e.name==="AbortError")throw new Error("응답 시간이 초과되었습니다. 잠시 후 다시 시도해 주세요.");
    if(e instanceof TypeError)throw new Error("서버에 연결할 수 없습니다. 네트워크 상태(사내 방화벽 포함)를 확인해 주세요.");
    throw e;
  }finally{clearTimeout(t)}
}
function errView(e,retry){
  if(/세션 만료|로그인이 필요/.test(e.message)){token="";try{sessionStorage.removeItem("shetok")}catch(_){}toast("관리자 세션이 만료되었습니다. 다시 로그인해 주세요.");answering=null;return render()}
  main.innerHTML=`<div class="panel done-card"><div class="err" style="margin:0 0 14px">${esc(e.message)}</div><button class="btn" id="retry">다시 시도</button></div>`;
  $("#retry").onclick=retry;
}

const C_DONE="#2a78d6",C_WAIT="#eb6834",C_PRIV="#344155";

const REDUCE=matchMedia("(prefers-reduced-motion: reduce)").matches;
function tipBind(root){
  let t=document.getElementById("tip");if(!t){t=document.createElement("div");t.id="tip";t.hidden=true;t.setAttribute("role","tooltip");document.body.appendChild(t)}
  const show=(el,x,y)=>{t.textContent=el.dataset.tip;t.hidden=false;const w=t.offsetWidth;t.style.left=Math.max(6,Math.min(innerWidth-w-6,x+12))+"px";t.style.top=(y+14)+"px"};
  root.querySelectorAll("[data-tip]").forEach(el=>{
    el.tabIndex=0;
    el.addEventListener("mousemove",e=>show(el,e.clientX,e.clientY));
    el.addEventListener("mouseleave",()=>t.hidden=true);
    el.addEventListener("focus",()=>{const r=el.getBoundingClientRect();show(el,r.left+r.width/2,r.top)});
    el.addEventListener("blur",()=>t.hidden=true);
  });
}
function dashSkeleton(){
  return `<div class="dash-head"><h1>접수 현황</h1><span class="dash-asof scan">현황 집계 중<i>.</i><i>.</i><i>.</i></span></div>

}
function dashError(msg){
  return `<div class="dcard dash-err"><h3>접수 현황</h3><div class="sub" style="margin:0 0 10px">현황을 불러오지 못했습니다. 질의 접수는 아래에서 정상적으로 이용하실 수 있습니다.</div><button class="btn" id="dretry" type="button">다시 불러오기</button><div class="dash-asof" style="margin-top:8px">${esc(msg||"")}</div></div>`;
}
function countUp(root){
  root.querySelectorAll("[data-n]").forEach(el=>{
    const to=+el.dataset.n,dec=+(el.dataset.dec||0);
    if(REDUCE||!to){el.textContent=to.toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec});return}
    const t0=performance.now(),dur=900;
    (function f(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=(to*e).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec});if(p<1)requestAnimationFrame(f)})(t0);
  });
}
function growIn(root){
  const els=root.querySelectorAll("[data-w],[data-h],[data-arc]");
  requestAnimationFrame(()=>requestAnimationFrame(()=>els.forEach((el,i)=>{
    el.style.transitionDelay=(REDUCE?0:Math.min(i,14)*40)+"ms";
    if(el.dataset.w!==undefined)el.style.width=el.dataset.w+"%";
    if(el.dataset.h!==undefined)el.style.height=el.dataset.h+"%";
    if(el.dataset.arc!==undefined)el.setAttribute("stroke-dasharray",el.dataset.arc);
  })));
}

    <path d="${arc}" fill="none" stroke="${C_DONE}" stroke-width="12" stroke-dasharray="0 ${L.toFixed(1)}" data-arc="${(L*rate/100).toFixed(1)} ${L.toFixed(1)}" data-tip="답변 완료 ${answered}건 (${rate}%)"/>

    return `<div class="pr"><div class="pr-t">${esc(title)}</div><div class="pr-b">${it.map((x,i)=>{const t=x.t||TINT[Math.min(i,2)];const p=x.n/d.total*100;

  const c1=Object.entries(d.c1).map(([k,v])=>({nm:k,n:v.n})),c2=Object.entries(d.c2).map(([k,v])=>({nm:k,n:v.n}));

  const tbl=(h,rows)=>`<table><thead><tr>${h.map((x,i)=>`<th${i?' class="n"':""}>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<td${i?' class="n"':""}>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;

async function loadDash(force){
  const box=$("#dash");if(!box)return;
  const now=Date.now();
  if(!force&&statsCache&&now-statsCache.t<60000)return drawDash(statsCache.d);
  box.innerHTML=dashSkeleton();
  const t0=Date.now();
  try{
    const d=await api("stats",{},25000);
    const wait=Math.max(0,500-(Date.now()-t0));if(wait)await new Promise(r=>setTimeout(r,wait));  /* 스켈레톤이 번쩍이지 않도록 최소 0.5초 */
    statsCache={t:Date.now(),d};drawDash(d);
  }catch(e){
    if(!$("#dash"))return;
    $("#dash").innerHTML=dashError(e.message);
    $("#dretry").onclick=()=>loadDash(true);
  }
}

          <label class="f" id="pwwrap" hidden style="flex:1 1 220px">비밀번호 * (4자리 이상)<input type="password" id="f-pw" maxlength="20" autocomplete="new-password"></label>
        </div>
        <div class="tag" id="pubnote" style="white-space:normal;margin-top:6px">${PUB_NOTE}</div>
      </div>
      <div class="lab">질의 내용 *</div>
      <div class="fld"><textarea id="f-q" maxlength="2000" placeholder="상황, 장소, 관련 설비나 작업을 구체적으로 적어 주세요. 구체적이지 않은 질의는 '보류' 처리될 수 있습니다."></textarea>
        <div class="tag" style="text-align:right"><span id="qlen">0</span> / 2,000자</div></div>
      <div class="lab">첨부파일<small>선택 · 최대 5개</small></div>
      <div class="fld">
        <label class="drop" id="drop" for="f-file">파일을 끌어 놓거나 눌러서 선택<br><span class="tag">jpg, png, pdf, docx(워드), xlsx(엑셀) · 파일당 10MB · 합계 25MB</span></label>
        <input type="file" id="f-file" multiple accept=".jpg,.jpeg,.png,.pdf,.docx,.xlsx" hidden>
        <div class="files" id="flist"></div>
      </div>
    </div>
    <div class="consent">
      <label><input type="checkbox" id="ck1"> <span><b>[필수]</b> 개인정보 수집·이용·제공에 동의합니다.</span></label>
      <details><summary>수집 항목 및 이용 목적</summary>수집 항목: 이름, 사업장, 소속부서, 이메일(선택) · 이용 목적: 질의 회신, 처리 결과 안내 및 접수·답변 알림 메일 발송 · 보유 기간: 처리 완료 후 3년</details>
      <label id="ck2wrap"><input type="checkbox" id="ck2"> <span><b>[필수]</b> 개인정보를 제외한 질의 내용과 답변이 전체 공개되어 활용될 수 있음에 동의합니다.</span></label>
    </div>
    <div class="actions"><span class="err" id="ferr"></span><button type="reset" class="btn">초기화</button><button type="submit" class="btn pri" id="fsubmit">접수하기</button></div>
  </form>`;
  draftFiles=[];
  const docwrap=$("#docwrap");
  $("#f-site").onchange=()=>{const dp=$("#f-dept"),st=$("#f-site").value;dp.innerHTML=deptOpts(st);dp.disabled=!st};
  main.querySelectorAll('input[name=c2]').forEach(r=>r.onchange=()=>{docwrap.hidden=main.querySelector('input[name=c2]:checked').value!=="MESH"});
  main.querySelectorAll('input[name=c1]').forEach(r=>r.onchange=()=>{$("#f-doc").innerHTML=docOpts(r.value,"","선택 안 함")});
  loadDash();$("#gof").onclick=e=>{e.preventDefault();$("#formtop").scrollIntoView({behavior:"smooth"})};
  main.querySelectorAll('input[name=pub]').forEach(r=>r.onchange=()=>{const pub=main.querySelector('input[name=pub]:checked').value==="1";$("#pwwrap").hidden=pub;$("#ck2wrap").hidden=!pub;$("#pubnote").textContent=pub?PUB_NOTE:PRIV_NOTE});
  $("#f-q").oninput=e=>$("#qlen").textContent=e.target.value.length.toLocaleString();
  const fi=$("#f-file"),drop=$("#drop");
  const MB=1024*1024;
  const addFiles=list=>{const ok=/\.(jpe?g|png|pdf|docx|xlsx)$/i;
    for(const f of list){if(!ok.test(f.name)){toast(`${f.name}: 허용되지 않는 형식입니다`);continue}
      if(f.size>10*MB){toast(`${f.name}: 10MB를 넘습니다`);continue}
      if(draftFiles.length>=5){toast("첨부는 최대 5개입니다");break}
      if(draftFiles.reduce((s,x)=>s+x.size,0)+f.size>25*MB){toast("첨부 합계는 25MB까지입니다");break}
      draftFiles.push(f)}
    drawFiles()};
  const drawFiles=()=>$("#flist").innerHTML=draftFiles.map((f,i)=>`<span class="chip"><span>${esc(f.name)}</span><button type="button" aria-label="삭제" data-i="${i}">×</button></span>`).join("");
  $("#flist").onclick=e=>{const b=e.target.closest("[data-i]");if(b){draftFiles.splice(+b.dataset.i,1);drawFiles()}};
  fi.onchange=()=>{addFiles(fi.files);fi.value=""};
  ["dragenter","dragover"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over")}));
  ["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("over")}));
  drop.addEventListener("drop",e=>addFiles(e.dataTransfer.files));
  $("#f").addEventListener("reset",()=>setTimeout(()=>{draftFiles=[];drawFiles();$("#qlen").textContent="0";$("#f-dept").innerHTML=deptOpts("");$("#f-dept").disabled=true;docwrap.hidden=true;$("#pwwrap").hidden=true;$("#ck2wrap").hidden=false;$("#pubnote").textContent=PUB_NOTE;$("#f-doc").innerHTML=docOpts("안전보건","","선택 안 함");$("#ferr").textContent=""}));
  const b64=f=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]);fr.onerror=()=>rej(new Error(f.name+" 파일을 읽을 수 없습니다."));fr.readAsDataURL(f)});
  $("#f").addEventListener("submit",async e=>{e.preventDefault();
    const site=$("#f-site").value,q=$("#f-q").value.trim(),err=$("#ferr");
    if(!site)return err.textContent="사업장을 선택해 주세요.";
    if(q.length<10)return err.textContent="질의 내용을 10자 이상 입력해 주세요.";
    const pub=main.querySelector('input[name=pub]:checked').value==="1",pw=$("#f-pw").value;
    if(!pub&&pw.length<4)return err.textContent="비공개 질의는 비밀번호를 4자리 이상 입력해 주세요.";
    if(!$("#ck1").checked||(pub&&!$("#ck2").checked))return err.textContent=pub?"필수 동의 항목 2개에 모두 체크해 주세요.":"개인정보 수집·이용 동의(필수)에 체크해 주세요.";
    const email=$("#f-email").value.trim();
    if(email&&!/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(email))return err.textContent="이메일 형식이 올바르지 않습니다.";
    err.textContent="";
    const c2=main.querySelector('input[name=c2]:checked').value,name=$("#f-name").value.trim();
    const btn=$("#fsubmit");btn.disabled=true;btn.textContent="접수 중…";
    try{
      const files=await Promise.all(draftFiles.map(async f=>({name:f.name,b64:await b64(f)})));
      const res=await api("submit",{name,site,dept:$("#f-dept").value,c1:main.querySelector('input[name=c1]:checked').value,c2,
        doc:c2==="MESH"?$("#f-doc").value:"",q,email,pub,pw:pub?"":pw,consent:true,consentPublic:pub,files},180000);
      const msg=pub?(name?"‘나의 질의’에서 처리 상태와 답변을 확인할 수 있습니다.":"익명으로 접수되어 개별 회신 확인은 어렵습니다. 답변은 ‘전체 질의’에 공개됩니다.")
        :(name?"비공개로 접수되었습니다. ‘나의 질의’에서 처리 상태를 확인하고, 내용은 비밀번호로 열람할 수 있습니다.":"비공개로 접수되었습니다. 위 접수번호와 입력하신 비밀번호로 ‘접수번호 조회’에서 확인할 수 있으니 접수번호를 꼭 보관해 주세요. 비밀번호는 복구할 수 없습니다.");
      const mailMsg=res.mail==="sent"?`<p class="lede" style="margin:0 auto 8px">접수 확인 메일을 <b>${esc(email)}</b>로 보냈습니다. 답변이 등록되면 같은 주소로 알려 드립니다.</p>`
        :res.mail==="failed"?`<p class="lede" style="margin:0 auto 8px;color:var(--danger)">접수는 완료되었으나 확인 메일 발송에 실패했습니다. 주소를 확인하시고, 접수번호를 보관해 주세요.</p>`
        :`<p class="lede" style="margin:0 auto 8px;color:var(--muted)">이메일을 작성하지 않아 안내 메일은 발송되지 않습니다. 화면에서 처리 상태를 확인해 주세요.</p>`;
      main.innerHTML=`<div class="panel done-card"><div class="tag">접수가 완료되었습니다</div><div class="no">${esc(res.id)}</div>
        <p class="lede" style="margin:8px auto 8px">${msg}</p>${mailMsg}<div style="height:12px"></div>
        <div class="row" style="justify-content:center;gap:8px"><button class="btn" id="again">새 질의 작성</button><button class="btn pri" id="gonext">${name?"나의 질의 보기":(pub?"전체 질의 보기":"접수번호 조회")}</button></div></div>`;
      $("#again").onclick=()=>viewNew();
      $("#gonext").onclick=()=>{if(name){mineQ={name,site};tab="mine"}else if(pub){tab="all"}else{tab="lookup";lookupPre=res.id}openRow=null;render()};
    }catch(ex){err.textContent=ex.message;btn.disabled=false;btn.textContent="접수하기"}
  });
}

/* ---------- 2-1. 나의 질의 ---------- */
function viewMine(){
  if(!mineQ.name){
    main.innerHTML=`<h1>나의 질의</h1>
    <p class="lede">질의 접수 때 입력한 이름과 사업장으로 내가 남긴 질의의 처리 상태를 확인합니다. 비공개 질의의 내용은 비밀번호를 입력해야 열람할 수 있습니다.</p>
    <form class="panel" id="mf" novalidate><div class="form">
      <div class="lab">사업장</div><div class="fld"><select id="m-site">${opt(SITES,"","선택")}</select></div>
      <div class="lab">이름</div><div class="fld"><input type="text" id="m-name" maxlength="30" autocomplete="off"></div>
    </div><div class="actions"><span class="err" id="merr"></span><button class="btn pri" type="submit">조회</button></div></form>`;
    $("#mf").addEventListener("submit",e=>{e.preventDefault();
      const name=$("#m-name").value.trim(),site=$("#m-site").value;
      if(!name||!site)return $("#merr").textContent="사업장과 이름을 입력해 주세요.";
      mineQ={name,site};openRow=null;viewMine()});

  }
  loading();
  api("mine",mineQ).then(r=>{rows=r;redraw=drawMine;drawMine()}).catch(e=>errView(e,viewMine));
}
function drawMine(){
  main.innerHTML=`<h1>나의 질의</h1>
  <p class="lede">${esc(mineQ.name)} · ${esc(mineQ.site)} 이름으로 접수한 질의입니다. 행을 누르면 질의 원문과 답변을 볼 수 있습니다. <button class="back" id="chg" style="margin:0 0 0 8px">다른 이름으로 조회</button></p>
  <div class="panel"><div class="tablehead">총 <b>${rows.length}</b>건 · 답변대기 <b>${rows.filter(r=>r.st==="wait").length}</b>건</div>
  <div class="tscroll"><table>
    <thead><tr><th>질의일시</th><th>구분1</th><th>구분2</th><th>질의내용</th><th>답변일시</th><th>상태</th><th>첨부</th></tr></thead>
    <tbody>${rows.length?rows.map(r=>rowHtml(r,["at","c1","c2q","q","aAt","st","files"],7)).join(""):`<tr><td colspan="7" class="empty">해당 이름으로 접수된 질의가 없습니다. 접수 때 입력한 이름·사업장과 같은지 확인해 주세요.</td></tr>`}</tbody>
  </table></div></div>`;
  $("#chg").onclick=()=>{mineQ={name:"",site:""};viewMine()};
  bindRows();
}

  <p class="lede">익명으로 접수했거나 비공개로 접수한 질의는 접수번호와 비밀번호로 확인할 수 있습니다.</p>
  <form class="panel" id="lf" novalidate><div class="form">
    <div class="lab">접수번호</div><div class="fld"><input type="text" id="l-id" placeholder="예) ESH-261016-003" autocomplete="off" value="${esc(lookupPre)}"></div>
    <div class="lab">비밀번호</div><div class="fld"><input type="password" id="l-pw" autocomplete="off"></div>
  </div><div class="actions"><span class="err" id="lerr"></span><button type="submit" class="btn pri" id="lbtn">조회</button></div></form><div id="lres"></div>`;
  lookupPre="";
  $("#lf").addEventListener("submit",async e=>{e.preventDefault();
    const id=$("#l-id").value.trim(),pw=$("#l-pw").value;$("#lres").innerHTML="";
    if(!id||!pw)return $("#lerr").textContent="접수번호와 비밀번호를 입력해 주세요.";
    $("#lerr").textContent="";const b=$("#lbtn");b.disabled=true;
    try{
      const r=await api("lookup",{id,pw});

      $("#lres").innerHTML=`<div class="panel" style="margin-top:16px"><div class="tablehead"><b>${esc(r.id)}</b> · ${esc(r.at)} 접수 · ${badge(r.st)}</div><div class="detail-box">
        <div><h4>질의 원문</h4><p>${esc(r.q)}</p>${nf}</div>
        <div><h4>ESH 담당자 답변 ${badge(r.st)}</h4><p>${r.a?esc(r.a):"아직 답변이 등록되지 않았습니다."}</p>${r.aAt?`<div class="tag" style="margin-top:6px">${esc(r.aAt)} 회신</div>`:""}</div></div></div>`;

/* ---------- 공통 행 렌더 ---------- */
function filesChips(r){
  if(r.files)return r.files.map(f=>`<a class="chip" href="https://drive.google.com/file/d/${esc(f.id)}/view" target="_blank" rel="noopener"><span>📎 ${esc(f.n)}</span></a>`).join("");
  return r.nf?`<span class="chip"><span>📎 첨부 ${r.nf}개</span></span>`:"";
}
function detailHtml(r){
  if(r.locked&&r.blind)return `<div class="detail-box"><div><h4><span class="doc">${esc(r.id)}</span></h4><p>관리자에 의해 블라인드 처리된 질의입니다.</p></div><div><h4>ESH 담당자 답변 ${badge(r.st)}</h4><p>-</p></div></div>`;
  if(r.locked){
    const canOpen=mode==="user"&&tab==="mine";
    return `<div class="detail-box"><div><h4>비공개 질의 · <span class="doc">${esc(r.id)}</span></h4><p>비공개로 접수된 질의입니다.</p>${canOpen?`<div class="row" style="margin-top:10px"><input type="password" id="u-pw" placeholder="비밀번호" autocomplete="off"><button class="btn sm pri" data-unlock="${esc(r.id)}">열람</button></div>`:""}</div>
      <div><h4>ESH 담당자 답변 ${badge(r.st)}</h4><p>${r.a?"비공개 답변입니다.":"아직 답변이 등록되지 않았습니다."}</p></div></div>`;
  }
  const f=filesChips(r);
  return `<div class="detail-box">
    <div><h4>질의 원문 · <span class="doc">${esc(r.id)}</span></h4><p>${esc(r.q)}</p>${f?`<div class="files">${f}</div>`:""}</div>
    <div><h4>ESH 담당자 답변 ${badge(r.st)}</h4><p>${r.a?esc(r.a):"아직 답변이 등록되지 않았습니다."}</p>${r.aAt?`<div class="tag" style="margin-top:6px">${esc(r.aAt)} 회신</div>`:""}</div></div>`;
}
function rowHtml(r,cols,span){
  const nf=r.files?r.files.length:(r.nf||0);
  const docCell=r.doc?`<span class="doc">${esc(r.doc)}</span><div class="tag">${esc(DOC_NAME[r.doc]||"")}</div>`:'<span class="tag">-</span>';
  const cell={
    at:`<td class="date">${esc(r.at)}</td>`,name:`<td>${r.name?esc(r.name):'<span class="tag">익명</span>'}</td>`,site:`<td>${esc(r.site)}</td>`,
    dept:`<td>${r.dept?esc(r.dept):'<span class="tag">-</span>'}</td>`,c1:`<td>${esc(r.c1)}</td>`,c2:`<td>${esc(r.c2)}</td>`,
    c2q:`<td>${esc(r.c2)}${r.doc?`<div class="doc">${esc(r.doc)}</div><div class="tag">${esc(DOC_NAME[r.doc]||"")}</div>`:""}</td>`,
    doc:`<td>${docCell}</td>`,
    q:`<td class="q"><div class="t">${r.del?"🗑 ":""}${r.blind&&r.locked?"🚫 관리자에 의해 블라인드 처리된 질의입니다":(r.blind?"🚫 ":"")+(r.pub===false?"🔒 ":"")+(r.locked?"비공개 질의입니다":esc(r.q))}</div></td>`,
    a:`<td class="q"><div class="t">${r.blind&&r.locked?'<span class="tag">-</span>':r.a?(r.locked?"🔒 비공개 답변입니다":esc(r.a)):'<span class="tag">답변 대기 중</span>'}</div></td>`,
    aAt:`<td class="date">${r.aAt?esc(r.aAt):'<span class="tag">-</span>'}</td>`,st:`<td>${badge(r.st)}</td>`,
    files:`<td class="clip">${nf?"📎 "+nf:"-"}</td>`,
    who:`<td>${r.name?esc(r.name):(r.locked?'<span class="tag">-</span>':'<span class="tag">익명</span>')}</td>`,
    btn:`<td>${r.del?`<button class="btn sm" data-restore="${esc(r.id)}">복구</button> <button class="btn sm" data-purge="${esc(r.id)}" style="color:var(--danger)">영구삭제</button>`:`<button class="btn sm ${r.st==="wait"?"pri":""}" data-ans="${esc(r.id)}">${r.st==="wait"?"답변하기":"수정"}</button>`}</td>`
  };
  let h=`<tr class="clickable" data-row="${esc(r.id)}">${cols.map(c=>cell[c]).join("")}</tr>`;
  if(openRow===r.id)h+=`<tr class="detail"><td colspan="${span}">${detailHtml(r)}</td></tr>`;
  return h;
}
function bindRows(){
  main.querySelectorAll("[data-row]").forEach(tr=>tr.onclick=e=>{if(e.target.closest("[data-ans],[data-restore],[data-purge]"))return;if(mode==="admin"&&tab==="manage"){answering=tr.dataset.row;return viewAnswer()}if(tab==="all")return openView(tr.dataset.row);openRow=openRow===tr.dataset.row?null:tr.dataset.row;redraw()});
  main.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>{answering=b.dataset.ans;viewAnswer()});
  main.querySelectorAll("[data-restore]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api("adminDelete",{token,id:b.dataset.restore,mode:"restore"});toast(`${b.dataset.restore} 복구했습니다`);viewManage()}catch(e){toast(e.message);b.disabled=false}});
  main.querySelectorAll("[data-purge]").forEach(b=>b.onclick=async()=>{
    if(!confirm(`${b.dataset.purge} 을(를) 영구삭제합니다.\n질의·답변 내용과 첨부파일이 삭제되며 복구할 수 없습니다. 계속할까요?`))return;
    b.disabled=true;try{await api("adminDelete",{token,id:b.dataset.purge,mode:"purge"});toast(`${b.dataset.purge} 영구삭제했습니다`);viewManage()}catch(e){toast(e.message);b.disabled=false}});
  main.querySelectorAll("[data-unlock]").forEach(b=>b.onclick=async()=>{
    const pw=$("#u-pw").value;if(!pw)return toast("비밀번호를 입력해 주세요.");
    b.disabled=true;
    try{const full=await api("lookup",{id:b.dataset.unlock,pw});const i=rows.findIndex(x=>x.id===full.id);if(i>=0)rows[i]={...rows[i],...full};redraw()}
    catch(e){toast(e.message);b.disabled=false}
  });
}

/* ---------- 필터 ---------- */
function filtersHtml(admin){

/* ---------- CSV 내려받기 (현재 목록, 엑셀 호환 UTF-8 BOM) ---------- */
function exportCsv(list){
  if(!list.length)return toast("내려받을 질의가 없습니다.");
  const head=["접수번호","접수일시","사업장","소속부서","이름","이메일","구분1","구분2","문서번호","질의내용","답변내용","답변일시","상태","공개여부","블라인드","삭제일시"];
  const cell=v=>{v=String(v??"");if(/^[=+\-@\t\r]/.test(v))v="'"+v;return `"${v.replace(/"/g,'""')}"`};
  const lines=[head.map(cell).join(",")].concat(list.map(r=>[r.id,r.at,r.site,r.dept,r.name||"익명",r.email,r.c1,r.c2,r.doc,r.q,r.a,r.aAt,ST[r.st].t,r.pub===false?"비공개":"공개",r.blind?"Y":"",r.del||""].map(cell).join(",")));
  const blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const d=new Date(),ymd=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`ESH질의응답_${ymd}.csv`;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(`${list.length}건을 내려받았습니다. 개인정보가 포함되어 있으니 관리에 유의해 주세요.`);
}

        <div class="row" style="margin-top:8px"><span class="err" id="e-err" style="flex:1"></span><button type="button" class="btn sm pri" id="e-save" style="flex:0 0 auto">수정 저장</button></div>
      </details></div>
    <div class="lab">블라인드<small>전체 질의 화면에서 가림</small></div><div>
      ${r.pub===false?'<span class="tag" style="white-space:normal">비공개 질의는 전체 질의 화면에서 이미 내용이 가려져 있어 블라인드가 필요하지 않습니다.</span>'
      :`<div class="tag" style="white-space:normal;margin-bottom:8px">${r.blind?"🚫 현재 블라인드 상태입니다. 전체 질의에는 ‘관리자에 의해 블라인드 처리된 질의’로만 표시됩니다.":"부적절하거나 개인정보가 포함된 공개 질의를 전체 질의에서 즉시 가립니다. 질의자 본인(나의 질의)과 관리자는 계속 볼 수 있습니다."}</div>
        <div class="row"><input type="text" id="b-note" maxlength="100" placeholder="사유 (관리 이력에 기록)"><button type="button" class="btn sm ${r.blind?"":"pri"}" id="b-btn" style="flex:0 0 auto">${r.blind?"블라인드 해제":"블라인드 처리"}</button></div>`}
    </div>
    <div class="lab">삭제<small>휴지통으로 이동</small></div><div>
      <div class="tag" style="white-space:normal;margin-bottom:8px">삭제하면 사용자 화면에서 즉시 사라지고 관리자 ‘휴지통’으로 이동합니다. 휴지통에서 복구하거나 영구삭제할 수 있습니다.</div>
      <button type="button" class="btn sm" id="d-trash" style="color:var(--danger)">휴지통으로 이동</button></div>`}
    <div class="lab">관리 이력</div><div><div class="hist" id="loghist">불러오는 중…</div></div>
  </div></div>
  <div class="mfoot"><span class="err" id="aerr"></span><button type="button" class="btn" id="cancel">닫기</button><button type="submit" form="af" class="btn pri" id="asave"${r.del?" disabled":""}>답변 저장</button></div></div>`;
  m.querySelector(".mbody").scrollTop=keep;if(!had)m.querySelector(".mdlg").focus();
  const back=()=>closeAnswer(true);
  const reload=async msg=>{rows=await api("adminList",{token});modalDirty=true;toast(msg);viewAnswer()};
  const act=(btn,fn)=>btn&&(btn.onclick=async()=>{btn.disabled=true;try{await fn()}catch(ex){if(/세션 만료|로그인이 필요/.test(ex.message))return errView(ex);toast(ex.message);btn.disabled=false}});
  api("adminLog",{token,id:r.id}).then(l=>{$("#loghist").innerHTML=l.length?l.map(x=>`<span><span class="mono">${esc(x.at)}</span> ${esc(x.act)}${x.detail?" · "+esc(x.detail):""}</span>`).join(""):'<span>관리 이력이 없습니다.</span>'}).catch(()=>{$("#loghist").textContent="이력을 불러오지 못했습니다."});
  if($("#e-c1")){
    $("#e-c1").onchange=()=>{$("#e-doc").innerHTML=docOpts($("#e-c1").value,"","선택 안 함")};
    $("#e-c2").onchange=()=>{$("#e-docw").hidden=$("#e-c2").value!=="MESH"};
    act($("#e-save"),async()=>{const q=$("#e-q").value.trim();if(q.length<5){$("#e-err").textContent="질의 내용을 입력해 주세요.";throw new Error("질의 내용을 입력해 주세요.")}
      await api("adminEdit",{token,id:r.id,q,c1:$("#e-c1").value,c2:$("#e-c2").value,doc:$("#e-c2").value==="MESH"?$("#e-doc").value:"",note:$("#e-note").value.trim()});await reload("질의를 수정했습니다.")});
    act($("#b-btn"),async()=>{await api("adminBlind",{token,id:r.id,on:!r.blind,note:$("#b-note").value.trim()});await reload(r.blind?"블라인드를 해제했습니다.":"블라인드 처리했습니다.")});
    act($("#d-trash"),async()=>{if(!confirm(`${r.id} 을(를) 삭제(휴지통 이동)합니다. 사용자 화면에서 즉시 사라지며 휴지통에서 복구할 수 있습니다.`))throw new Error("취소했습니다.");
      await api("adminDelete",{token,id:r.id,mode:"trash"});toast(`${r.id} 을(를) 휴지통으로 이동했습니다`);closeAnswer(true)});
  }else{
    act($("#g-restore"),async()=>{await api("adminDelete",{token,id:r.id,mode:"restore"});toast(`${r.id} 복구했습니다`);closeAnswer(true)});
    act($("#g-purge"),async()=>{if(!confirm(`${r.id} 을(를) 영구삭제합니다.\n질의·답변 내용과 첨부파일이 삭제되며 복구할 수 없습니다. 계속할까요?`))throw new Error("취소했습니다.");
      await api("adminDelete",{token,id:r.id,mode:"purge"});toast(`${r.id} 영구삭제했습니다`);closeAnswer(true)});
  }
  $("#mclose").onclick=$("#cancel").onclick=()=>closeAnswer();$("#mback").onclick=()=>closeAnswer();
  $("#af").addEventListener("submit",async e=>{e.preventDefault();
    const a=$("#a-text").value.trim(),s=m.querySelector('input[name=ast]:checked');
    if(a.length<5)return $("#aerr").textContent="답변 내용을 입력해 주세요.";
    if(!s)return $("#aerr").textContent="답변상태(완료·보류·개선예정)를 선택해 주세요.";
    const b=$("#asave");b.disabled=true;b.textContent="저장 중…";
    try{const rs=await api("answer",{token,id:r.id,a,st:s.value}),m=rs.mail||{};
      toast(`${r.id} 답변을 ‘${ST[s.value].t}’로 저장했습니다`+(m.requester==="sent"?" · 질의자에게 메일 발송":m.requester==="failed"?" · 질의자 메일 발송 실패(주소 확인)":""));back()}
    catch(ex){if(/세션 만료|로그인이 필요/.test(ex.message))return errView(ex);$("#aerr").textContent=ex.message;b.disabled=false;b.textContent="답변 저장"}
  });
}

render();
</script>

<script>
document.getElementById('theme-tg').addEventListener('click',function(){var r=document.documentElement,c=r.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'),n=c==='dark'?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('yess-theme',n)}catch(e){}});
</script>
</body></html>
