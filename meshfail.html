<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MESH 부적합 사례 검색기</title>
<style>
:root{--navy:#1B2C5C;--blue:#1D4F9F;--bg:#F4F6FA;--line:#D9DEE8;--mut:#5B6577;--hl:#FFF2A8}
*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:#1c2333;font-size:14px}
header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:18px}header span{font-size:12px;opacity:.8}
main{max-width:1180px;margin:0 auto;padding:16px 20px 60px}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
#q{width:100%;font-size:16px;padding:11px 14px;border:2px solid var(--blue);border-radius:8px;outline:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.lab{font-size:12px;color:var(--mut);width:56px;flex:none;font-weight:700}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 11px;font-size:12.5px;cursor:pointer;user-select:none;font-family:inherit}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip .n{opacity:.65;font-size:11px;margin-left:3px}
.tools{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:6px;padding:5px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--blue);color:#fff}
#count{font-weight:700;color:var(--navy)}
#bars{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bar{font-size:11.5px;background:#EEF2FA;border-radius:4px;padding:3px 8px;color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:11px 14px;margin-bottom:9px}
.card.env{border-left-color:#2E8B57}.card.ps{border-left-color:#C0392B}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;margin-bottom:6px}
.tag{padding:2px 8px;border-radius:10px;background:#EEF2FA;color:var(--navy);font-weight:700}
.tag.site{background:var(--navy);color:#fff}.tag.ps{background:#FDE9E7;color:#C0392B}.tag.env{background:#E4F3EA;color:#2E8B57}
.dept{color:var(--mut)}
.body{white-space:pre-wrap;line-height:1.55;font-size:13.5px}
.foot{margin-top:7px;font-size:12px;color:var(--mut);display:flex;gap:14px;flex-wrap:wrap}
.foot b{color:#333}.topics{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
.topics span{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--mut);cursor:pointer}
mark{background:var(--hl);padding:0 1px;border-radius:2px}
#more{display:block;margin:12px auto}
.empty{text-align:center;color:var(--mut);padding:40px}
.badge{background:#FFF2A8;color:#6b5200;border-radius:10px;padding:2px 8px;font-weight:700}.hint{font-size:12px;color:var(--mut);margin-top:8px}
label.sw{font-size:12.5px;color:var(--mut);cursor:pointer}
</style></head><body>
<header><h1>MESH 부적합 사례 검색기</h1><span id="meta"></span></header>
<main>
<div class="box">
 <input id="q" type="search" placeholder="문장으로 물어보세요  예) 청양공장에서 질산 경고표지 문제 있었어? · 작년 하반기 밀폐공간 허가서 · 끼임 방호 미설치" autofocus>
 <div class="hint">문장·조사가 섞여도 핵심어를 뽑아 찾고, 사업장·기간(예: 청양, 26년 상반기, 작년)은 자동 인식합니다. 단어 앞에 - 를 붙이면 제외. <label class="sw"><input type="checkbox" id="syn" checked> 유사어 포함</label> <label class="sw"><input type="checkbox" id="strict"> 모든 단어 일치만</label></div><div id="interp" class="hint" style="color:#1B2C5C;font-weight:700"></div>
 <div class="row"><span class="lab">사업장</span><span id="f-site"></span></div>
 <div class="row"><span class="lab">기간</span><span id="f-per"></span></div>
 <div class="row"><span class="lab">점검</span><span id="f-chk"></span><span class="lab" style="margin-left:14px">분야</span><span id="f-fld"></span><span class="lab" style="margin-left:14px">구분</span><span id="f-kind"></span></div>
 <div class="row"><span class="lab">주제</span><span id="f-tag"></span></div>
</div>
<div class="tools"><div><span id="count"></span> <span id="bars"></span></div><div><button class="btn" id="reset">필터 초기화</button> <button class="btn" id="csv">결과 CSV 저장</button></div></div>
<div id="list"></div><button class="btn" id="more" style="display:none">더 보기</button>
</main>

const SYN=[["msds","물질안전보건자료","물질안전","안전보건자료"],["경고표지","경고표시","경고 표지","경고표지판"],["표지","표지판","표시","안내표지"],["허가서","작업허가","안전작업허가","허가"],["밀폐공간","밀폐 공간","질식","산소농도"],["송기마스크","공기호흡기","호흡용 보호구","호흡보호구","방독마스크"],["충전부","감전","활선","분전반","전기판넬"],["끼임","협착","회전축","구동부"],["방호","방호장치","덮개","안전커버","방호조치"],["수급","도급","협력업체","협력사","외주","수급업체"],["폐기물","지정폐기물","폐산","폐유"],["질산","질산조","nitric"],["가성소다","수산화나트륨","naoh"],["지게차","리프트","포크"],["소화기","소화전","소방"],["폐수","배수","방류","배출"],["보호구","마스크","안전화","보안경","보호복"],["훈련","비상대응","비상사태"],["체크리스트","점검표","일지"],["교육","수료","이수","교육이력"],["누락","미기재","미작성","미실시","미흡","없음"],["미설치","미부착","미비치","미비","미적용"],["사다리","추락","고소작업"],["위험성평가","리스크","리스크평가"],["변경관리","변경"],["화학물질","유해물질","약품","화학"],["유출","누출","누액","누수"],["목표","추진계획","목표관리"],["검교정","교정","측정기"]];
const STOP=new Set("관련 문제 사례 사례들 건 있었어 있었나 있나 있어 있는지 있었는지 알려줘 알려 찾아줘 찾아 보여줘 보여 뭐 뭐가 어떤 무엇 대한 대해 관해 지적 부적합 내용 리스트 목록 좀 혹시 있다 여부 경우 것 해줘 얼마나 몇 어디 없어 없나 아니 및 그리고 또는 에서 있음 했나 했어 나왔어 나왔나 나온 있었던 있던 한 안 못 안한".split(" "));
const SUF=["에서는","에서","에게","으로는","으로","로는","까지","부터","이라고","이었나","였나","입니까","인가요","인가","인지","이나","에는","에도","은","는","이","가","을","를","의","와","과","도","로","에","만","나","랑","들"];
const st={q:"",site:new Set(),per:new Set(),chk:new Set(),fld:new Set(),kind:new Set(),tag:new Set(),page:1,noauto:false};
const PAGE=60;
const bg=s=>{const a=new Set();for(let i=0;i<s.length-1;i++)a.add(s.substr(i,2));return a};
D.forEach(r=>{r._t=(r.s+" "+r.p+" "+r.f+" "+r.c+" "+r.g+" "+r.j+" "+r.d+" "+r.k+" "+r.t+" "+r.v).toLowerCase();r._b=bg(r._t.replace(/\s+/g,""))});
function stem(w){w=w.replace(/[?？!.,~…"'()]/g,"");for(const s of SUF){if(w.length>s.length+1&&w.endsWith(s)){return w.slice(0,-s.length)}}return w}
function perBy(y,half){return PERS.filter(p=>p.startsWith("'"+y)&&(!half||(half==="1H"?/1H|1Q|2Q/:/2H|3Q|4Q/).test(p)))}
function analyze(){
 let q=st.q.trim();const neg=[];
 q=q.replace(/(^|\s)-(\S+)/g,(m,a,w)=>{neg.push(w.toLowerCase());return a+" "});
 const aSite=new Set(),aPer=new Set();
 if(!st.noauto){
  SITES.forEach(s=>{const re=new RegExp(s+"(공장|사업장)?","i");if(re.test(q)){aSite.add(s);q=q.replace(re," ")}});
  q=q.replace(/(\d{2})\s*년?\s*(상반기|하반기|[1-4]\s*[qQ]|[12]\s*[hH])/g,(m,y,t)=>{let h=/상반기/.test(t)?"1H":/하반기/.test(t)?"2H":t.replace(/\s/g,"").toUpperCase();const key="'"+y+" "+h;if(PERS.includes(key))aPer.add(key);else perBy(y,/[12]H|[12]Q/.test(h)&&h[0]==="1"||h==="2Q"?"1H":"2H").forEach(p=>aPer.add(p));return" "});
  q=q.replace(/(재작년|작년|지난해|올해|금년)\s*(상반기|하반기)?/g,(m,w,hh)=>{const y=/재작년/.test(w)?"24":/작년|지난해/.test(w)?"25":"26";perBy(y,hh?(hh==="상반기"?"1H":"2H"):"").forEach(p=>aPer.add(p));return" "});
 }
 const tokens=q.split(/[\s,/·]+/).map(stem).filter(w=>w&&!STOP.has(w)&&w.length>=1);
 return{tokens,neg:neg.map(stem),aSite,aPer};
}
function expand(t){t=t.toLowerCase();const out=new Set([t]);if(document.getElementById("syn").checked){SYN.forEach(g=>{if(g.some(x=>x.toLowerCase()===t||(t.length>=2&&x.length>=2&&(x.toLowerCase().includes(t)||t.includes(x.toLowerCase())))))g.forEach(x=>out.add(x.toLowerCase()))})}return[...out]}
function score(r,A){let sc=0,m=0;for(const g of A.groups){if(g.some(x=>r._t.includes(x))){sc+=1;m++}else{const t=g[0];if(t.length>=3){const b=[...bg(t)];const cov=b.filter(x=>r._b.has(x)).length/b.length;if(cov>=0.75){sc+=.6;m++}}}}return{sc,m}}
function filt(){
 const A=analyze();A.groups=A.tokens.map(expand);const n=A.groups.length;A.n=n;
 const strict=document.getElementById("strict").checked;
 const need=strict?n:(n<=2?1:2);
 const effSite=st.site.size?st.site:A.aSite,effPer=st.per.size?st.per:A.aPer;
 const rows=[];
 for(const r of D){
  if(effSite.size&&!effSite.has(r.s))continue;if(effPer.size&&!effPer.has(r.p))continue;
  if(st.chk.size&&!st.chk.has(r.k))continue;if(st.fld.size&&!st.fld.has(r.f))continue;if(st.kind.size&&!st.kind.has(r.n))continue;
  if(st.tag.size&&![...st.tag].every(t=>r.m.includes(t)))continue;
  if(A.neg.length&&A.neg.some(w=>r._t.includes(w)))continue;
  if(n){const s=score(r,A);if(s.m<need)continue;r._s=s.sc;r._m=s.m}else{r._s=0;r._m=0}
  rows.push(r)}
 if(n)rows.sort((a,b)=>b._s-a._s);
 A.eff={site:effSite,per:effPer};return{rows,A};
}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function hi(s,A){let h=esc(s);const ws=[...new Set(A.groups.flat())].filter(w=>w.length>0);if(!ws.length)return h;const re=new RegExp("("+ws.sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");return h.replace(re,"<mark>$1</mark>")}
function chips(id,vals,key,cnt){const el=document.getElementById(id);el.innerHTML="";vals.forEach(v=>{const b=document.createElement("button");b.className="chip"+(st[key].has(v)?" on":"");b.innerHTML=esc(v)+(cnt?`<span class="n">${cnt[v]||0}</span>`:"");b.onclick=()=>{st[key].has(v)?st[key].delete(v):st[key].add(v);st.page=1;render()};el.appendChild(b)})}
function counts(rows,key,multi){const c={};rows.forEach(r=>{(multi?r[key]:[r[key]]).forEach(v=>{if(v)c[v]=(c[v]||0)+1})});return c}
const ALLTAGS=[...new Set(D.flatMap(r=>r.m))].sort((a,b)=>D.filter(r=>r.m.includes(b)).length-D.filter(r=>r.m.includes(a)).length);
function render(){
 const{rows,A}=filt();
 const cs=counts(rows,"s"),cp=counts(rows,"p"),cc=counts(rows,"k"),cf=counts(rows,"f"),cn=counts(rows,"n"),ct=counts(rows,"m",true);
 chips("f-site",SITES,"site",cs);chips("f-per",PERS,"per",cp);
 chips("f-chk",[...new Set(D.map(r=>r.k))],"chk",cc);chips("f-fld",[...new Set(D.map(r=>r.f).filter(Boolean))],"fld",cf);chips("f-kind",[...new Set(D.map(r=>r.n))],"kind",cn);chips("f-tag",ALLTAGS,"tag",ct);
 const full=A.n?rows.filter(r=>r._m>=A.n).length:rows.length;
 document.getElementById("count").textContent=rows.length.toLocaleString()+"건"+(A.n&&full<rows.length?` (모든 단어 일치 ${full}건)`:"");
 document.getElementById("bars").innerHTML=SITES.filter(s=>cs[s]).map(s=>`<span class="bar">${s} ${cs[s]}</span>`).join("");
 const parts=[];if(!st.site.size&&A.aSite.size)parts.push("사업장 "+[...A.aSite].join("·"));if(!st.per.size&&A.aPer.size)parts.push("기간 "+[...A.aPer].join("·"));if(A.n)parts.push("핵심어 "+A.tokens.join(", "));if(A.neg.length)parts.push("제외 "+A.neg.join(", "));
 document.getElementById("interp").textContent=parts.length?"해석 → "+parts.join(" / "):"";
 const el=document.getElementById("list");
 if(!rows.length){el.innerHTML='<div class="empty">검색 결과가 없습니다.<br>핵심어를 줄이거나 "모든 단어 일치만"을 해제하고, 필터를 풀어 보세요.</div>';document.getElementById("more").style.display="none";return}
 const show=rows.slice(0,st.page*PAGE);
 el.innerHTML=show.map(r=>`<div class="card ${r.f==="환경"?"env":""} ${r.k.startsWith("불시")?"ps":""}">
 <div class="meta"><span class="tag site">${esc(r.s)}</span><span class="tag">${esc(r.p)}</span><span class="tag ${r.k.startsWith("불시")?"ps":""}">${esc(r.k)}</span>${r.f?`<span class="tag ${r.f==="환경"?"env":""}">${esc(r.f)}</span>`:""}${r.n!=="부적합"?`<span class="tag">${esc(r.n)}</span>`:""}<span class="dept">${hi(r.d,A)}</span>${A.n?`<span class="badge">일치 ${r._m}/${A.n}</span>`:""}</div>
 <div class="body">${hi(r.c,A)}</div>
 <div class="foot">${r.g?`<span><b>근거</b> ${hi(r.g,A)}</span>`:""}${r.j?`<span><b>조항</b> ${hi(r.j,A)}</span>`:""}${r.t?`<span><b>유형</b> ${esc(r.t)}</span>`:""}${r.w?`<span><b>위험요소</b> ${esc(r.w)}</span>`:""}${r.a?`<span><b>조치</b> ${esc(r.a)}</span>`:""}<span><b>번호</b> ${esc(r.v)}</span></div>
 ${r.m.length?`<div class="topics">${r.m.map(t=>`<span data-t="${esc(t)}">#${esc(t)}</span>`).join("")}</div>`:""}</div>`).join("");
 el.querySelectorAll(".topics span").forEach(s=>s.onclick=()=>{st.tag.add(s.dataset.t);st.page=1;render();scrollTo(0,0)});
 const mb=document.getElementById("more");mb.style.display=rows.length>show.length?"block":"none";mb.textContent=`더 보기 (${show.length}/${rows.length})`;
}
document.getElementById("q").oninput=e=>{st.q=e.target.value;st.page=1;render()};
document.getElementById("syn").onchange=render;document.getElementById("strict").onchange=render;
document.getElementById("more").onclick=()=>{st.page++;render()};
document.getElementById("reset").onclick=()=>{st.q="";document.getElementById("q").value="";["site","per","chk","fld","kind","tag"].forEach(k=>st[k].clear());st.page=1;render()};
document.getElementById("csv").onclick=()=>{const{rows}=filt();const H=["기간","점검","사업장","분야","구분","부서","내용","근거","조항","유형","위험요소","주제태그","조치현황","관리번호"];const q=s=>'"'+String(s||"").replace(/"/g,'""')+'"';const lines=[H.join(",")].concat(rows.map(r=>[r.p,r.k,r.s,r.f,r.n,r.d,r.c,r.g,r.j,r.t,r.w,r.m.join(";"),r.a,r.v].map(q).join(",")));const b=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="부적합_검색결과.csv";a.click()};
document.getElementById("meta").textContent=`총 ${D.length}건 · 24 1Q ~ 26 2H · 8개 사업장 · 오프라인 작동`;
render();
</script></body></html>
